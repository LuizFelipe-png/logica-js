<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="exercicio">
        <h1>Adivinhação</h1>

        <label for="palpite">Digite seu palpite (1 a 100)</label>
        <input type="number" id="palpite" min="1" max="100" step="1">

        <button id="botao">Chutar</button>

        <p id="resultado" class="saida">O resultado aparece aqui.</p>
        <p id="historico" class="saida">Chutes: </p>
    </main>

    <script src="js/adivinhacao-completo.js"></script>
</body>
</html>
