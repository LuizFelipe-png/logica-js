<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frete | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="exercicio">
        <h1>Frete</h1>

        <label for="valor">Valor da compra</label>
        <input type="number" id="valor" step="0.1">

        <select id="regiao">
            <option value="0">Selecione a região</option>
            <option value="1">Sul</option>
            <option value="2">Sudeste</option>
            <option value="3">Centro-Oeste</option>
            <option value="4">Nordeste</option>
            <option value="5">Norte</option>
        </select>

        <button id="calcular">Calcular</button>

        <p id="saida" class="saida">O resultado aparece aqui.</p>
    </main>

    <script src="js/frete.js"></script>
</body>
</html>
