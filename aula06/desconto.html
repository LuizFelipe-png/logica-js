<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Desconto | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="exercicio">
        <h1>Calculador de Desconto</h1>

        <label for="valor">Valor Compra:</label>
        <input type="number" id="valor" step="0.1">

        <label for="porcentagem">Porcentagem de desconto:</label>
        <input type="number" id="porcentagem" step="0.1">

        <button id="calcular">Calcular</button>

        <p id="resultado" class="resultado">O desconto aparece aqui.</p>
        <p id="valorFinal" class="resultado">O valor final aparece aqui.</p>
    </main>

    <script src="js/desconto.js"></script>
</body>
</html>
